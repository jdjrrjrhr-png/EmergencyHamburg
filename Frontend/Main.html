<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Hamburg API</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #08080a;
            --bg-card: rgba(20, 20, 24, 0.72);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.14);
            --text-primary: #f2f2f4;
            --text-secondary: #91919c;
            --text-muted: #56565f;
            --accent: #5e96ff;
            --accent-gradient: linear-gradient(180deg, #7db4ff 0%, #5e96ff 100%);
            --success: #3ecf8e;
            --transition: 160ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Geist', 'Inter', -apple-system, sans-serif;
        }
        html { background-color: var(--bg-primary); }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            padding: 24px;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 24px 24px;
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, #000 0%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, #000 0%, transparent 75%);
            pointer-events: none;
        }
        body::after {
            content: "";
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 500px;
            background: radial-gradient(ellipse at center, rgba(94, 150, 255, 0.16) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        svg { stroke-width: 1.5; }

        .container {
            position: relative;
            z-index: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            background-color: rgba(255, 255, 255, 0.03);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.18);
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #06111f;
            margin: 0 auto 24px;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.3) inset, 0 12px 24px rgba(94, 150, 255, 0.25);
        }
        .brand-mark svg { width: 26px; height: 26px; }

        h1 {
            color: var(--text-primary);
            margin-bottom: 14px;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        p.lede {
            color: var(--text-secondary);
            margin-bottom: 34px;
            font-size: 15px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 9px;
            font-size: 14.5px;
            font-weight: 600;
            transition: all var(--transition);
            border: 1px solid transparent;
            cursor: pointer;
            flex: 1;
        }
        .btn svg { width: 17px; height: 17px; }
        .btn-primary {
            background: var(--accent-gradient);
            color: #06111f;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset, 0 8px 20px rgba(94, 150, 255, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }
        .btn-secondary {
            background-color: transparent;
            border-color: var(--border-strong);
            color: var(--text-primary);
        }
        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .footnote {
            margin-top: 28px;
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .buttons { flex-direction: column; }
            .container { padding: 36px 26px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge"><span class="dot"></span> All systems operational</div>
        <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
        </div>
        <h1>Emergency Hamburg API</h1>
        <p class="lede">A moderation and management platform for Roblox servers. Control and monitor your servers seamlessly.</p>
        <div class="buttons">
            <a href="../Dashboard/Dashboard.html" class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                Dashboard
            </a>
            <a href="../Document/Document.html" class="btn btn-secondary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                Documentation
            </a>
        </div>
        <p class="footnote">v8.0 &bull; Built for Roblox server operators</p>
    </div>
</body>
</html>
